<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Haskell Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container">
        <div id="sidebar">
            <h3>Online Users</h3>
            <input type="text" id="user-search" placeholder="Tim kiem nguoi dung...">
            <ul id="user-list">
                </ul>
        </div>
        
        <div id="main-chat">
            <div id="chat-box-wrapper">
                <div id="chat-box">
                    </div>
            </div>
            <div id="input-area">
                <div id="chat-target">Dang chat voi: <strong>Tat Ca Moi Nguoi</strong></div>
                <input type="text" id="message-input" placeholder="Go tin nhan...">
                <button id="send-btn">Gui</button>
            </div>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
