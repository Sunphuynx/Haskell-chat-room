<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Haskell Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="login-screen">
            <h2>Đăng ký tài khoản</h2>
            <div id="register-form">
                <input type="text" id="reg-user" placeholder="Tên đăng nhập">
                <input type="password" id="reg-pass" placeholder="Mật khẩu">
                <input type="password" id="reg-pass-confirm" placeholder="Xác nhận mật khẩu">
                <button id="reg-btn">Đăng ký</button>
                <p id="auth-error"></p>
                <p class="auth-link">Đã có tài khoản? <a href="/">Đăng nhập</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
