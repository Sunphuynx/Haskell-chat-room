<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dang Ky - Haskell Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="login-screen"> <h2>Dang Ky Tai Khoan</h2>
            <div id="register-form">
                <input type="text" id="reg-user" placeholder="Ten dang nhap">
                <input type="password" id="reg-pass" placeholder="Mat khau">
                <input type="password" id="reg-pass-confirm" placeholder="Xac nhan mat khau">
                <button id="reg-btn">Dang Ky</button>
                <p id="auth-error"></p>
                <p class="auth-link">Da co tai khoan? <a href="/">Dang nhap</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
