<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dang Nhap - Haskell Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="login-screen">
            <h2>Dang Nhap Chat</h2>
            <div id="login-form">
                <input type="text" id="login-user" placeholder="Ten dang nhap">
                <input type="password" id="login-pass" placeholder="Mat khau">
                <button id="login-btn">Vao Chat</button>
                <p id="auth-error"></p>
                <p class="auth-link">Chua co tai khoan? <a href="/register">Dang ky ngay</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
