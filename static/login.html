<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Haskell Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="login-screen">
            <h2>Đăng nhập Chat</h2>
            <div id="login-form">
                <input type="text" id="login-user" placeholder="Tên đăng nhập">
                <input type="password" id="login-pass" placeholder="Mật khẩu">
                <button id="login-btn">Vào Chat</button>
                <p id="auth-error"></p>
                <p class="auth-link">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
