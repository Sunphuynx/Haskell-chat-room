# package.yaml (PHIÊN BẢN HOÀN CHỈNH ĐÃ SỬA)
name:                haskell-chat-room
version:             0.1.0.0
github:              "your-github-username/haskell-chat-room"
license:             MIT
author:              "Phung Chi Tam & Pham Duy Hoang"
maintainer:          "tamphung.31231024593@st.ueh.edu.vn"
extra-source-files:  ["README.md"]

synopsis:            Ung dung chat room da nguoi dung voi truyen file (Haskell)
category:            Network

# Thư viện chung cho toàn bộ dự án
library:
  source-dirs: src
  exposed-modules:  # Chi export nhung module chung ta co
    - Database
    - Protocol
    - State
  dependencies:
    - base >= 4.7 && < 5
    - containers
    - stm
    - text
    - bytestring
    - aeson            # Thu vien JSON
    - websockets       # Thu vien WebSocket
    - sqlite-simple  # Thu vien Database
    - cryptonite       # Thu vien bam mat khau

# Server (Chương trình chính)
executables:
  server-exe:
    main: Main.hs
    source-dirs: app/server
    ghc-options:       # Chuyen ghc-options vao day
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - haskell-chat-room  # Ten du an (de lay code tu src/)
      - base
      - scotty           # Thu vien Web Server
      - warp             # May chu Web
      - wai-websockets   # Ket noi WebSocket voi Scotty
      - text
      - bytestring
      - aeson
      - mtl              # Can thiet cho Scotty
      - wai-cors         # De tranh loi CORS khi phat trien
      - stm
      - websockets
      - containers
      - http-types
      - wai
      - sqlite-simple

# Khong con client-exe nua

# Phan test giu nguyen
tests:
  haskell-chat-room-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:         -Wall
    dependencies:
      - haskell-chat-room
      - base
      - HUnit
      - tasty
      - tasty-hunit